services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: honey_user
      POSTGRES_PASSWORD: honey_password
      POSTGRES_DB: honeyforge
    networks:
      - mgmt-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honey_user -d honeyforge"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  control_api:
    build: ./center
    environment:
      DATABASE_URL: postgresql://honey_user:honey_password@db:5432/honeyforge
      PYTHONUNBUFFERED: "1"
    networks:
      - mgmt-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./frontend:/usr/share/nginx/html:ro,z
    networks:
      - dmz-network
      - mgmt-network
    depends_on:
      - control_api
    restart: unless-stopped

  agent_low:
    build: ./agent
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - dmz-network
    ports:
      - "2121:21"
      - "2323:23"
      - "2222:2222"
    volumes:
      - agent_data:/app/data
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  dmz-network:
    driver: bridge
  mgmt-network:
    driver: bridge
    internal: true

volumes:
  pgdata:
  agent_data: